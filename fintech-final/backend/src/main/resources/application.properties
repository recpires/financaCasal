spring.application.name=fintech
server.port=8080

# Banco Oracle da FIAP
# Usuario e senha vem das variaveis de ambiente DB_USERNAME e DB_PASSWORD
# (ou troque os valores depois dos dois-pontos pelo seu RM e senha).
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=${DB_USERNAME:RMXXXXX}
spring.datasource.password=${DB_PASSWORD:XXXXXX}

# As tabelas sao criadas pelo script database/script_tabelas.sql (o Hibernate nao altera o banco)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
